<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing | butter.io</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 0;
        background: #fafafa;
        color: #333;
      }
      .pricing-section {
        max-width: 900px;
        margin: 4rem auto;
        padding: 0 2rem;
        text-align: center;
      }
      .pricing-tier-wrapper {
        display: flex;
        justify-content: center;
        gap: 2rem;
        margin-top: 3rem;
        flex-wrap: wrap;
      }
      .tier-card {
        background: white;
        border: 1px solid #eaeaea;
        border-radius: 8px;
        padding: 2.5rem;
        width: 280px;
        text-align: center;
        position: relative;
      }
      .tier-card.featured {
        border: 2px solid #0056b3;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
      }
      .badge {
        position: absolute;
        top: -12px;
        left: 50%;
        transform: translateX(-50%);
        background: #0056b3;
        color: white;
        padding: 0.25rem 0.7rem;
        font-size: 0.8rem;
        border-radius: 20px;
        text-transform: uppercase;
      }
      .price {
        font-size: 2.5rem;
        font-weight: bold;
        margin: 1.5rem 0;
        color: #111;
      }
      .tier-btn {
        display: block;
        width: 100%;
        padding: 0.75rem;
        background: #333;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        font-weight: bold;
      }
      .tier-card.featured .tier-btn {
        background: #0056b3;
      }
    </style>
  </head>
  <body>
    <main class="pricing-section">
      <h1>Plans Built for Teams of Any Size</h1>
      <p>
        No hidden setup fees. Upgrade or downgrade your subscription at any
        time.
      </p>

      <div class="pricing-tier-wrapper">
        <div class="tier-card">
          <h3>Starter</h3>
          <div class="price">$0</div>
          <p style="margin-bottom: 1.5rem; color: #666">
            Perfect for hobbyists and local testing.
          </p>
          <a href="#" class="tier-btn">Get Started</a>
        </div>
        <div class="tier-card featured">
          <div class="badge">Most Popular</div>
          <h3>Pro Developer</h3>
          <div class="price">
            $19<span style="font-size: 1rem; color: #666">/mo</span>
          </div>
          <p style="margin-bottom: 1.5rem; color: #666">
            Advanced components and database limits.
          </p>
          <a href="#" class="tier-btn">Go Pro</a>
        </div>
      </div>
    </main>
  </body>
</html>
