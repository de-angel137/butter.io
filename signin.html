<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | butter.io</title>
    <link rel="stylesheet" href="signin.css" />
  </head>
  <body>
    <form class="container">
      <div class="sign-in-container">
        <h2 class="form-heading">Sign In</h2>

        <div class="input-wrapper">
          <input
            type="text"
            name="username"
            id="username"
            class="input-field"
          />
          <label for="username">Username</label>
        </div>

        <div class="input-wrapper">
          <input
            type="password"
            name="password"
            id="password"
            class="input-field"
          />
          <label for="password">Password</label>
        </div>

        <!-- <div class="remember-me-field">
          <p>
            <label for="remember-me">Remember Me</label>
            <input type="checkbox" name="remember-me" id="remember-me" />
          </p>
        </div> -->

        <div class="links-wrapper-container">
          <div class="links-wrapper">
            <span class="remember-me-field">
              <label for="remember-me">Remember Me</label>
              <input type="checkbox" name="remember-me" id="remember-me" />
            </span>

            <span class="signup-link">
              Don't have an account? <a href="#">Sign up</a>
            </span>
          </div>
        </div>

        <div class="submit-btn-wrapper">
          <a href="#" class="btn submit-btn">Sign In</a>
        </div>
      </div>
      <a href='index.html' class='bth-footer-link'>Back to Home</a>
    </form>
  </body>
</html>
