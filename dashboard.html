<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | butter.io</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 0;
        background: #f0f2f5;
        color: #333;
      }
      .dashboard-layout {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 2rem;
        display: grid;
        grid-template-columns: 240px 1fr;
        gap: 2rem;
      }
      .side-panel {
        background: white;
        padding: 1.5rem;
        border-radius: 8px;
        border: 1px solid #eaeaea;
        height: fit-content;
      }
      .side-panel ul {
        list-style: none;
        padding: 0;
      }
      .side-panel li {
        padding: 0.75rem 0;
        border-bottom: 1px solid #f0f0f0;
      }
      .main-panel {
        background: white;
        padding: 2rem;
        border-radius: 8px;
        border: 1px solid #eaeaea;
      }
      .stats-row {
        display: flex;
        gap: 1.5rem;
        margin-top: 1.5rem;
        flex-wrap: wrap;
      }
      .stat-box {
        flex: 1;
        min-width: 150px;
        background: #f8f9fa;
        padding: 1.5rem;
        border-radius: 6px;
        border-left: 4px solid #0056b3;
      }
      .stat-box span {
        font-size: 1.8rem;
        font-weight: bold;
        color: #111;
      }
    </style>
  </head>
  <body>
    <div class="dashboard-layout">
      <aside class="side-panel">
        <h4 style="margin-bottom: 1rem; color: #666">Account Control</h4>
        <ul>
          <li>Overview</li>
          <li>API Credentials</li>
          <li>Project Settings</li>
          <li>Billing</li>
        </ul>
      </aside>

      <main class="main-panel">
        <h1>Welcome back, Admin</h1>
        <p>Here is your production stream summary for today.</p>

        <div class="stats-row">
          <div class="stat-box">
            <p style="margin: 0; color: #666; font-size: 0.9rem">
              Active Users
            </p>
            <span>1,432</span>
          </div>
          <div class="stat-box">
            <p style="margin: 0; color: #666; font-size: 0.9rem">
              Server Status
            </p>
            <span style="color: #28a745">99.9%</span>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
